# RedPandaium Cast - Docker Compose Template
# 
# Quick start:
#   1. Copy .env.example to .env and set your GROQ_API_KEY
#   2. Run: docker compose -f docker-compose.example.yml up -d
#   3. Access at: http://localhost:3000

services:
  jw-cast:
    image: ghcr.io/mercu7io/redpandaiumcast:latest
    container_name: jw-cast
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Injected from your host environment or .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Security PIN for application lock screen (defaults to 1234)
      - APP_PIN=${APP_PIN:-1234}
    volumes:
      - ./log:/app/log
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


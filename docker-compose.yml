services:
  jw-cast:
    image: ghcr.io/mercu7io/redpandaiumcast:latest
    container_name: jw-cast
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Inject the Groq API key from your host environment or .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Security PIN for application lock screen (defaults to 1234)
      - APP_PIN=${APP_PIN:-1234}
    volumes:
      - ./log:/app/log

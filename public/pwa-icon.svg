    <path d="M 340 140 A 110 110 0 0 1 420 220" />
    <path d="M 370 140 A 70 70 0 0 1 420 190" />
    <circle cx="410" cy="150" r="8" fill="#38BDF8" stroke="none"/>
  </g>

